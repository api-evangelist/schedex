name: Schedex
description: Schedex is a workforce management platform built for food and beverage businesses,
  consolidating staff scheduling, shift management, attendance tracking, and payroll into a
  single mobile-first application. It offers mobile clock in/out with location technology,
  schedule optimization across multiple locations, real-time labor-cost tracking and reporting,
  automated wage and payroll calculation, leave requests and shift exchange, and a multilingual
  branded app, with the goal of reducing labor costs by up to 15 percent. Schedex was surfaced
  as a portfolio company of 500 Global and added to the API Evangelist network; it publishes no
  public API, developer portal, SDK, or documentation surface at this time.
